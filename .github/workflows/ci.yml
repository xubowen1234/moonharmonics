name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: check-build-test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official MoonBit toolchain
        shell: bash
        run: |
          curl --fail --show-error --location --retry 2 https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh" '0.10.18+6c83a7f62'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain and formatting
        run: |
          moon version --all
          moon info
          moon fmt --check
          git diff --exit-code -- '*.mbti' '*.mbt' 'moon.mod' 'moon.pkg'
      - name: Strict check, build and test
        run: |
          moon check --target ${{ matrix.target }} --deny-warn
          moon build --target ${{ matrix.target }} --deny-warn
          moon test --target ${{ matrix.target }} --deny-warn
      - name: Run three downstream workflows
        run: |
          moon run examples/graphics --target ${{ matrix.target }}
          moon run examples/audio --target ${{ matrix.target }}
          moon run examples/science --target ${{ matrix.target }}
      - name: Independent numerical reference
        run: |
          python -m pip install 'numpy==2.3.4' 'scipy==1.16.3'
          python scripts/reference_check.py --target ${{ matrix.target }}
